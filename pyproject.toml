[project]
name = "ocr-python"
version = "0.1.0"
description = "FastAPI service with PaddleOCR for accurate text recognition"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "paddlepaddle==2.6.2",
    "paddleocr==2.8.1",
    "opencv-python-headless>=4.9.0.80",
    "pillow>=10.2.0",
    "numpy<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
